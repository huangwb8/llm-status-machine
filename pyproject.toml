[project]
name = "llm-status-machine"
dynamic = ["version"]
description = "Auditable local experiment runner for LLM CLI harnesses"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
  "filelock>=3.18,<4",
  "pydantic>=2.11,<3",
  "pyyaml>=6.0.2,<7",
  "rich>=14.0,<15",
  "typer>=0.16,<1",
]

[project.optional-dependencies]
test = [
  "hypothesis>=6.135,<7",
  "pytest>=8.4,<9",
  "pytest-asyncio>=1.0,<2",
  "ruff>=0.12,<1",
]
analysis = [
  "numpy>=2.3,<3",
  "scipy>=1.16,<2",
]

[project.scripts]
lsm = "llm_status_machine.cli.app:app"

[project.entry-points."llm_status_machine.harnesses"]
simulator = "llm_status_machine.harnesses.builtin:SimulatorAdapter"
codex_exec_cli = "llm_status_machine.harnesses.builtin:CodexAdapter"
claude_print_cli = "llm_status_machine.harnesses.builtin:ClaudeCodeAdapter"
custom_command = "llm_status_machine.harnesses.builtin:CustomCommandAdapter"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/llm_status_machine"]

[tool.hatch.version]
path = "src/llm_status_machine/version.py"

[tool.pytest.ini_options]
addopts = "-q"
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["llm_status_machine"]

[tool.ruff]
target-version = "py312"
line-length = 110
