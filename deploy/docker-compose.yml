name: llm-status-machine

services:
  app:
    build:
      context: .
      dockerfile: deploy/Dockerfile
    image: ${IMAGE:-llm-status-machine:local}
    ports:
      - "${BIND_HOST:-0.0.0.0}:${PORT:-4317}:4317"
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 4317
      STORAGE_DRIVER: ${STORAGE_DRIVER:-postgres}
      QUEUE_DRIVER: ${QUEUE_DRIVER:-redis}
      EVENT_BUS: ${EVENT_BUS:-redis}
      DATABASE_URL: ${DATABASE_URL:-postgres://llm_status:llm_status_password@postgres:5432/llm_status_machine}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      DATA_DIR: /app/data
      RUNS_DIR: /app/data/runs
      DEFAULT_STATE_PATH: ${DEFAULT_STATE_PATH:-/workspaces/examples/buggy-js}
      LLM_STATUS_MACHINE_API: ${LLM_STATUS_MACHINE_API:-http://localhost:4317}
    volumes:
      - llm_status_data:/app/data
      - "${WORKSPACES_MOUNT:-./examples}:${WORKSPACES_TARGET:-/workspaces/examples}:${WORKSPACES_MOUNT_MODE:-rw}"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:4317/api/health').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    restart: unless-stopped

  worker:
    image: ${IMAGE:-llm-status-machine:local}
    build:
      context: .
      dockerfile: deploy/Dockerfile
    command: npm run worker
    environment:
      NODE_ENV: production
      STORAGE_DRIVER: ${STORAGE_DRIVER:-postgres}
      QUEUE_DRIVER: ${QUEUE_DRIVER:-redis}
      EVENT_BUS: ${EVENT_BUS:-redis}
      DATABASE_URL: ${DATABASE_URL:-postgres://llm_status:llm_status_password@postgres:5432/llm_status_machine}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      DATA_DIR: /app/data
      RUNS_DIR: /app/data/runs
      DEFAULT_STATE_PATH: ${DEFAULT_STATE_PATH:-/workspaces/examples/buggy-js}
      LLM_STATUS_MACHINE_API: ${LLM_STATUS_MACHINE_API:-http://app:4317}
    volumes:
      - llm_status_data:/app/data
      - "${WORKSPACES_MOUNT:-./examples}:${WORKSPACES_TARGET:-/workspaces/examples}:${WORKSPACES_MOUNT_MODE:-rw}"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-llm_status_machine}
      POSTGRES_USER: ${POSTGRES_USER:-llm_status}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-llm_status_password}
      PGDATA: /var/lib/postgresql/data
    volumes:
      - llm_status_postgres:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    restart: unless-stopped

  redis:
    image: redis:8-alpine
    command:
      - sh
      - -c
      - |
        if [ -n "$${REDIS_PASSWORD:-}" ]; then
          exec redis-server --appendonly yes --requirepass "$${REDIS_PASSWORD}"
        fi
        exec redis-server --appendonly yes
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
    volumes:
      - llm_status_redis:/data
    healthcheck:
      test:
        - CMD-SHELL
        - |
          if [ -n "$${REDIS_PASSWORD:-}" ]; then
            redis-cli -a "$${REDIS_PASSWORD}" ping
          else
            redis-cli ping
          fi
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    restart: unless-stopped

volumes:
  llm_status_data:
  llm_status_postgres:
  llm_status_redis:
